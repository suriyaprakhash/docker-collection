services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # You can keep websecure if you want local HTTPS, but for simple VPS forwarding, port 80 is easiest.
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      # 1. Listen on the standard 'web' (port 80) entrypoint for traffic coming from the VPS
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.rule=Host(`traefik.homelabs.suriyaprakhash.com`)"
      # 2. REMOVE the certresolver and tls=true lines so Traefik doesn't look for its own cert
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

networks:
  traefik-net:
    external: true